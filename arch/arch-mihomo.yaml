# macOS Mihomo — 优化版
# 本机直连订阅，不走家里 Clash

mixed-port: 7890
redir-port: 7892
tproxy-port: 7891
allow-lan: true
bind-address: 0.0.0.0
mode: rule
log-level: warning                # 🎯 info→warning，减少日志 I/O
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: /etc/mihomo/ui
secret: <YOUR_SECRET>                # 🎯 新增：API 加密码

dns:
  enable: true
  listen: 0.0.0.0:5353
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - https://doh.pub/dns-query
    - tls://223.5.5.5:853
  fallback:
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853          # 🎯 新增：fallback 备选
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-range: 198.18.0.1/16
  enhanced-mode: fake-ip
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.localhost'
    - '+.msftncsi.com'
    - '+.srnd'
    - '+.tail3fd170.ts.net'
    # 代理节点服务器域名（绕过 fake-ip，否则节点连不上）
    - '+.fatdns.net'
    - '+.hy2use.net'
    - '+.jf88.co'
    - '+.jfdddy.net'
  proxy-server-nameserver:
    - 223.5.5.5
    - 114.114.114.114

proxy-providers:
  Provider:
    type: http
    url: https://jfdddy.net/link/VTBaHMehkBM7MHTo?clash=1
    interval: 1800                  # 🎯 3600→1800，订阅更新更快
    path: /etc/mihomo/proxy-providers/provider.yaml
    health-check:
      enable: true
      interval: 180
      url: http://www.gstatic.com/generate_204

# ============================================================
# 规则提供者 — Loyalsoldier/clash-rules
# 社区维护的成熟分流规则，自动更新
# ============================================================
rule-providers:
  reject:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
    interval: 86400
    path: /etc/mihomo/rules/reject.yaml
  direct:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    interval: 86400
    path: /etc/mihomo/rules/direct.yaml
  private:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
    interval: 86400
    path: /etc/mihomo/rules/private.yaml
  proxy:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
    interval: 86400
    path: /etc/mihomo/rules/proxy.yaml
  apple:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt
    interval: 86400
    path: /etc/mihomo/rules/apple.yaml
  icloud:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt
    interval: 86400
    path: /etc/mihomo/rules/icloud.yaml
  cncidr:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
    interval: 86400
    path: /etc/mihomo/rules/cncidr.yaml

proxy-groups:
  - name: LowLatency
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 90
    tolerance: 20
    # 只在近端节点里选，避免美国/法国这类远距离节点参与最低延迟竞争。
    filter: 香港|HK|日本|JP|Tokyo|新加坡|SG|Singapore|台湾|TW|Taiwan|韩国|KR|Korea|直连
    use:
      - Provider

  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 180
    tolerance: 30
    # 只保留真实节点，排除订阅里的网址/流量/到期说明项。
    filter: 香港|HK|日本|JP|Tokyo|新加坡|SG|Singapore|台湾|TW|Taiwan|韩国|KR|Korea|马来西亚|MY|Malaysia|美国|US|America|法国|FR|France|直连
    use:
      - Provider

  - name: Fallback
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    filter: 香港|HK|日本|JP|Tokyo|新加坡|SG|Singapore|台湾|TW|Taiwan|韩国|KR|Korea|马来西亚|MY|Malaysia|美国|US|America|法国|FR|France|直连
    use:
      - Provider

  - name: LoadBalance
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 180
    filter: 香港|HK|日本|JP|Tokyo|新加坡|SG|Singapore|台湾|TW|Taiwan|韩国|KR|Korea|马来西亚|MY|Malaysia|美国|US|America|法国|FR|France|直连
    use:
      - Provider

  - name: Proxy
    type: select
    proxies:
      - LowLatency
      - Auto
      - Fallback
      - LoadBalance
      - DIRECT
    use:
      - Provider

rules:
  # --- 自定义规则（高优先级）---
  # 国内 AI 服务直连
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,minimax.com,DIRECT
  - DOMAIN-SUFFIX,hailuoai.com,DIRECT
  - DOMAIN-SUFFIX,ustc.edu.cn,DIRECT
  - DOMAIN-SUFFIX,debian.org,DIRECT
  - DOMAIN-SUFFIX,steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamcommunity.com,DIRECT
  - DOMAIN-SUFFIX,steamstatic.com,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamusercontent.com,DIRECT
  - DOMAIN-SUFFIX,steam-chat.com,DIRECT
  - DOMAIN-SUFFIX,steamserver.net,DIRECT
  - DOMAIN-SUFFIX,steamcdn-a.akamaihd.net,DIRECT
  - DOMAIN-SUFFIX,steambroadcast.akamaized.net,DIRECT
  - DOMAIN-SUFFIX,steampipe.akamaized.net,DIRECT

  # --- 社区规则集 (Loyalsoldier) ---
  - RULE-SET,reject,REJECT
  - RULE-SET,private,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,Proxy
  - RULE-SET,cncidr,DIRECT

  # --- GEOSITE 规则（兜底）---
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,google-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,speedtest,DIRECT
  - GEOSITE,netflix,Proxy
  - GEOSITE,youtube,Proxy
  - GEOSITE,geolocation-!cn,Proxy

  - GEOIP,CN,DIRECT
  - MATCH,Proxy

sniffer:
  enable: true
  sniffing:
    - tls
    - http
    - quic                    # 🎯 新增：嗅探 QUIC 流量

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-redirect: true
  dns-hijack:
    - any:53
