providers:
  my_codex:
    baseUrl: https://www.tokenrouter.tech/v1
    api: openai-responses
    models:
      - id: gpt-5.5
        name: GPT-5.5
        reasoning: true
        input: [text, image]

  deepseek:
    baseUrl: https://api.deepseek.com
    api: openai-completions
    authHeader: true
    models:
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        reasoning: true
        thinking:
          minLevel: high
          maxLevel: xhigh
          mode: effort
        input: [text]
        contextWindow: 1000000
        maxTokens: 384000
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          reasoningEffortMap:
            high: high
            xhigh: max
          supportsToolChoice: false
          requiresReasoningContentForToolCalls: true
          requiresAssistantContentForToolCalls: true
          extraBody:
            thinking:
              type: enabled
      - id: deepseek-v4-flash
        name: DeepSeek V4 Flash
        reasoning: true
        thinking:
          minLevel: minimal
          maxLevel: xhigh
          mode: effort
        input: [text]
        contextWindow: 1000000
        maxTokens: 384000
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          maxTokensField: max_tokens
          reasoningEffortMap:
            high: high
            xhigh: max
          supportsToolChoice: false
          requiresReasoningContentForToolCalls: true
          requiresAssistantContentForToolCalls: true
          extraBody:
            thinking:
              type: enabled

  scnet:
    baseUrl: https://api.scnet.cn/api/llm/v1
    api: openai-completions
    models:
      - id: MiniMax-M2.5
        name: MiniMax M2.5
        input: [text]
        reasoning: true
        compat:
          supportsDeveloperRole: false
      - id: Qwen3-235B-A22B
        name: Qwen 3-235B-A22B
        input: [text]
        reasoning: true
        contextWindow: 32768
        maxTokens: 14336
