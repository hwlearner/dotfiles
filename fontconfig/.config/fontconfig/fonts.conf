<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig.org:freedesktop:fonts.dtd">
<fontconfig>
  <!-- Sans-serif: HarmonyOS Sans 优先 -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>HarmonyOS Sans</family>
      <family>HarmonyOS Sans SC</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK JP</family>
    </prefer>
  </alias>

  <!-- Serif: Noto Serif CJK SC -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- Monospace: JetBrains Mono 优先，Maple Mono 兜底中文 -->
  <!-- 使用 match target="pattern" 确保覆盖系统规则的 prepend -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrains Mono</string>
      <string>JetBrains Mono NL</string>
      <string>Maple Mono NL NF CN</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!-- 确保 HarmonyOS Sans SC 也能被识别为中文 fallback -->
  <alias>
    <family>HarmonyOS Sans</family>
    <accept>
      <family>HarmonyOS Sans SC</family>
      <family>Noto Sans CJK SC</family>
    </accept>
  </alias>
</fontconfig>
