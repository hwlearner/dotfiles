#!/usr/sbin/nft -f

flush ruleset

table inet filter {
  chain input {
    type filter hook input priority filter; policy accept;

    iif "lo" tcp dport 9121 accept
    ip saddr 192.168.1.0/24 tcp dport 9121 accept
    tcp dport 9121 drop
  }

  chain forward {
    type filter hook forward priority filter; policy accept;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
