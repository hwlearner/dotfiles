allow-lan: true
bind-address: 0.0.0.0
dns:
  default-nameserver:
  - 223.5.5.5
  - 114.114.114.114
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
  - +.continue.dev
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.stun.sony.net
  - msftncsi.com
  - '*.msftncsi.com'
  - +.jfdddy.net
  - +.jf88.co
  fake-ip-range: 198.18.0.1/16
  fallback:
  - tls://1.12.12.12:853
  fallback-filter:
    geoip: true
    geoip-code: CN
  listen: 0.0.0.0:5353
  nameserver:
  - https://doh.pub/dns-query
  - tls://223.5.5.5:853
external-controller: 0.0.0.0:9090
external-ui: /etc/mihomo/ui
ipv6: false
log-level: info
mixed-port: 7890
mode: rule
proxy-groups:
- filter: 日本|JP|Tokyo
  interval: 300
  name: 日本
  tolerance: 50
  type: url-test
  url: http://www.gstatic.com/generate_204
  use:
  - Provider
- interval: 300
  name: Auto
  tolerance: 50
  type: url-test
  url: http://www.gstatic.com/generate_204
  use:
  - Provider
- interval: 300
  name: Fallback
  type: fallback
  url: http://www.gstatic.com/generate_204
  use:
  - Provider
- interval: 300
  name: LoadBalance
  strategy: consistent-hashing
  type: load-balance
  url: http://www.gstatic.com/generate_204
  use:
  - Provider
- name: Proxy
  proxies:
  - Auto
  - Fallback
  - LoadBalance
  - DIRECT
  type: select
  use:
  - Provider
proxy-providers:
  Provider:
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
    interval: 3600
    path: /etc/mihomo/proxy-providers/provider.yaml
    type: http
    url: https://jfdddy.net/link/VTBaHMehkBM7MHTo?clash=1

rule-providers:
  reject:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
    interval: 86400
    path: /etc/mihomo/rules/reject.yaml
  direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    interval: 86400
    path: /etc/mihomo/rules/direct.yaml
  private:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
    interval: 86400
    path: /etc/mihomo/rules/private.yaml
  proxy:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
    interval: 86400
    path: /etc/mihomo/rules/proxy.yaml
  apple:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt
    interval: 86400
    path: /etc/mihomo/rules/apple.yaml
  icloud:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt
    interval: 86400
    path: /etc/mihomo/rules/icloud.yaml
  cncidr:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
    interval: 86400
    path: /etc/mihomo/rules/cncidr.yaml

rules:
  # 自定义（高优）
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,minimax.com,DIRECT
  - DOMAIN-SUFFIX,hailuoai.com,DIRECT
  - DOMAIN-SUFFIX,ustc.edu.cn,DIRECT
  - DOMAIN-SUFFIX,debian.org,DIRECT
  - DOMAIN-SUFFIX,chatgpt.com,日本
  - DOMAIN-SUFFIX,openai.com,日本
  - DOMAIN-SUFFIX,oaistatic.com,日本
  - DOMAIN-SUFFIX,oaiusercontent.com,日本
  # 社区规则集
  - RULE-SET,reject,REJECT
  - RULE-SET,private,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,Proxy
  - RULE-SET,cncidr,DIRECT
  # GEOSITE 兜底
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,google-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,speedtest,DIRECT
  - GEOSITE,netflix,Proxy
  - GEOSITE,youtube,Proxy
  - GEOSITE,geolocation-!cn,Proxy
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
secret: ''
sniffer:
  enable: true
  force-domain: []
  sniffing:
  - tls
  - http
tproxy-port: 7891
tun:
  auto-redirect: true
  auto-route: true
  dns-hijack:
  - any:53
  enable: false
  stack: gvisor
