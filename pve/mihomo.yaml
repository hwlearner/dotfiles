allow-lan: true
bind-address: 0.0.0.0
dns:
  default-nameserver:
  - 223.5.5.5
  - 114.114.114.114
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
  - +.continue.dev
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.stun.sony.net
  - msftncsi.com
  - '*.msftncsi.com'
  - +.jfdddy.net
  - +.jf88.co
  fake-ip-range: 198.18.0.1/16
  fallback:
  - tls://1.12.12.12:853
  fallback-filter:
    geoip: true
    geoip-code: CN
  listen: 0.0.0.0:5353
  nameserver:
  - https://doh.pub/dns-query
  - tls://223.5.5.5:853
external-controller: 0.0.0.0:9090
external-ui: /etc/mihomo/ui
ipv6: false
log-level: info
mixed-port: 7890
mode: rule
proxy-groups:
- filter: 日本|JP|Tokyo
  interval: 300
  name: 日本
  tolerance: 50
  type: url-test
  url: http://www.gstatic.com/generate_204
  use:
  - Provider
- interval: 300
  name: Auto
  tolerance: 50
  type: url-test
  url: http://www.gstatic.com/generate_204
  use:
  - Provider
- interval: 300
  name: Fallback
  type: fallback
  url: http://www.gstatic.com/generate_204
  use:
  - Provider
- interval: 300
  name: LoadBalance
  strategy: consistent-hashing
  type: load-balance
  url: http://www.gstatic.com/generate_204
  use:
  - Provider
- name: Proxy
  proxies:
  - Auto
  - Fallback
  - LoadBalance
  - DIRECT
  type: select
  use:
  - Provider
proxy-providers:
  Provider:
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204
    interval: 3600
    path: /etc/mihomo/proxy-providers/provider.yaml
    type: http
    url: https://jfdddy.net/link/VTBaHMehkBM7MHTo?clash=1
rules:
- GEOSITE,category-ads-all,REJECT
- GEOSITE,private,DIRECT
- GEOSITE,microsoft@cn,DIRECT
- GEOSITE,apple-cn,DIRECT
- GEOSITE,google-cn,DIRECT
- GEOSITE,category-games@cn,DIRECT
- GEOSITE,speedtest,DIRECT
- DOMAIN-SUFFIX,deepseek.com,DIRECT
- DOMAIN-SUFFIX,minimax.com,DIRECT
- DOMAIN-SUFFIX,hailuoai.com,DIRECT
- DOMAIN-SUFFIX,ustc.edu.cn,DIRECT
- DOMAIN-SUFFIX,debian.org,DIRECT
- GEOSITE,netflix,Proxy
- GEOSITE,youtube,Proxy
- GEOSITE,geolocation-!cn,Proxy
- DOMAIN-SUFFIX,chatgpt.com,日本
- DOMAIN-SUFFIX,openai.com,日本
- DOMAIN-SUFFIX,oaistatic.com,日本
- DOMAIN-SUFFIX,oaiusercontent.com,日本
- GEOIP,CN,DIRECT
- MATCH,Proxy
secret: ''
sniffer:
  enable: true
  force-domain: []
  sniffing:
  - tls
  - http
tproxy-port: 7891
tun:
  auto-redirect: true
  auto-route: true
  dns-hijack:
  - any:53
  enable: false
  stack: gvisor
