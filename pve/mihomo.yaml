# Mihomo 透明网关 — 优化版
# PVE LXC 101 (192.168.1.20)

allow-lan: true
bind-address: 0.0.0.0
mixed-port: 7890
tproxy-port: 7891
mode: rule
log-level: warning                    # 🎯 info→warning
ipv6: false
external-controller: 0.0.0.0:9090
external-ui: /etc/mihomo/ui
secret: <REDACTED>

profile:
  store-selected: true                 # 持久化 Proxy=Auto 等手动/默认选择
  store-fake-ip: true

dns:
  enable: true
  enhanced-mode: fake-ip
  listen: 0.0.0.0:5353
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - https://doh.pub/dns-query
    - tls://223.5.5.5:853
  fallback:
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853            # 🎯 新增：fallback 备选
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.continue.dev
    - '*.lan'
    - '*.local'
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.stun.sony.net
    - msftncsi.com
    - '*.msftncsi.com'
    - +.jfdddy.net
    - +.jf88.co
  proxy-server-nameserver:           # 🎯 新增：节点域名专用 DNS
    - 223.5.5.5
    - 114.114.114.114

proxy-providers:
  Provider:
    type: http
    url: https://jfdddy.net/link/<REDACTED>
    interval: 1800                    # 🎯 3600→1800
    path: /etc/mihomo/proxy-providers/provider.yaml
    health-check:
      enable: true
      interval: 120
      url: http://www.gstatic.com/generate_204

rule-providers:
  reject:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
    interval: 86400
    path: /etc/mihomo/rules/reject.yaml
  direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    interval: 86400
    path: /etc/mihomo/rules/direct.yaml
  private:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
    interval: 86400
    path: /etc/mihomo/rules/private.yaml
  proxy:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
    interval: 86400
    path: /etc/mihomo/rules/proxy.yaml
  apple:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt
    interval: 86400
    path: /etc/mihomo/rules/apple.yaml
  icloud:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt
    interval: 86400
    path: /etc/mihomo/rules/icloud.yaml
  cncidr:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
    interval: 86400
    path: /etc/mihomo/rules/cncidr.yaml

proxy-groups:
  - filter: 日本|JP|Tokyo
    interval: 120
    name: 日本
    tolerance: 20                     # 更快收敛到低延迟节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    use:
      - Provider
  - interval: 120
    name: Auto
    tolerance: 20
    type: url-test
    url: http://www.gstatic.com/generate_204
    use:
      - Provider
  - interval: 120
    name: Fallback
    type: fallback
    url: http://www.gstatic.com/generate_204
    use:
      - Provider
  - interval: 120
    name: LoadBalance
    strategy: consistent-hashing
    type: load-balance
    url: http://www.gstatic.com/generate_204
    use:
      - Provider
  - interval: 120
    name: Proxy-Auto-Fallback
    proxies:
      - Auto
      - DIRECT
    type: fallback
    url: http://www.gstatic.com/generate_204
    timeout: 3000
  - name: Proxy
    proxies:
      - Proxy-Auto-Fallback
      - Auto
      - Fallback
      - LoadBalance
      - DIRECT
    type: select
    use:
      - Provider

rules:
  # 社区规则集
  - RULE-SET,reject,REJECT
  - RULE-SET,private,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,Proxy
  - RULE-SET,cncidr,DIRECT
  # GEOSITE 兜底
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,google-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,speedtest,DIRECT
  - GEOSITE,netflix,Proxy
  - GEOSITE,youtube,Proxy
  - GEOSITE,geolocation-!cn,Proxy
  - GEOIP,CN,DIRECT
  - MATCH,Proxy

sniffer:
  enable: true
  force-domain: []
  sniffing:
    - tls
    - http
    - quic                        # 🎯 新增：嗅探 QUIC

tun:
  auto-redirect: true
  auto-route: true
  dns-hijack:
    - any:53
  enable: false
  stack: gvisor
