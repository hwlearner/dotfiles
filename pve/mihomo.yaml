# Clash / Mihomo Configuration — 透明网关优化版
# Copy to /etc/mihomo/config.yaml on LXC
#
# Private fields (subscription URL) → pve/mihomo.private.yaml

mixed-port: 7890
tproxy-port: 7891
allow-lan: true
bind-address: 0.0.0.0
mode: rule
log-level: info
ipv6: false
external-controller: 0.0.0.0:9090
external-ui: /etc/mihomo/ui

tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-redirect: true

dns:
  enable: true
  listen: 0.0.0.0:5353
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fallback:
    - tls://8.8.4.4:853
    - https://1.1.1.1/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
  nameserver-policy:
    "geosite:cn,geosite:private": https://doh.pub/dns-query
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - msftncsi.com
    - '*.msftncsi.com'

sniffer:
  enable: true
  sniffing:
    - tls
    - http
  force-domain:
    - "*.netflix.com"
    - "*.youtube.com"

proxy-providers:
  <Provider>:
    type: http
    url: <SUBSCRIPTION_URL>
    interval: 3600
    path: /etc/mihomo/proxy-providers/<provider>.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

proxy-groups:
  - name: 日本
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - <Provider>
    filter: "日本|JP|Tokyo"
  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - <Provider>
  - name: Fallback
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - <Provider>
  - name: LoadBalance
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - <Provider>
  - name: Proxy
    type: select
    proxies:
      - Auto
      - Fallback
      - LoadBalance
      - DIRECT
    use:
      - <Provider>

rules:
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,google-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,speedtest,DIRECT
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,minimax.com,DIRECT
  - DOMAIN-SUFFIX,hailuoai.com,DIRECT
  - DOMAIN-SUFFIX,ustc.edu.cn,DIRECT
  - DOMAIN-SUFFIX,debian.org,DIRECT
  - DOMAIN-SUFFIX,chatgpt.com,日本
  - DOMAIN-SUFFIX,openai.com,日本
  - DOMAIN-SUFFIX,oaistatic.com,日本
  - DOMAIN-SUFFIX,oaiusercontent.com,日本
  - GEOSITE,netflix,Proxy
  - GEOSITE,youtube,Proxy
  - GEOSITE,geolocation-!cn,Proxy
  - GEOIP,CN,DIRECT
  - MATCH,Proxy
