# macOS Mihomo — 优化版
# 本机直连订阅，不走家里 Clash

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: warning                # 🎯 info→warning，减少日志 I/O
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: /Users/han/.config/mihomo/ui
secret: <YOUR_SECRET>                # 🎯 新增：API 加密码

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  listen: 127.0.0.1:1053
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - https://doh.pub/dns-query
    - tls://223.5.5.5:853
  fallback:
    - tls://1.12.12.12:853
    - tls://223.5.5.5:853          # 🎯 新增：fallback 备选
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-range: 198.18.0.1/16
  enhanced-mode: fake-ip
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.localhost'
    - '+.msftncsi.com'
    - '+.srnd'
    - '+.tail3fd170.ts.net'
    # 代理节点服务器域名（绕过 fake-ip，否则节点连不上）
    - '+.fatdns.net'
    - '+.hy2use.net'
    - '+.jf88.co'
    - '+.jfdddy.net'
  proxy-server-nameserver:
    - 223.5.5.5
    - 114.114.114.114

proxy-providers:
  Provider:
    type: http
    url: https://jfdddy.net/link/VTBaHMehkBM7MHTo?clash=1
    interval: 3600
    path: /Users/han/.config/mihomo/provider.yaml
    health-check:
      enable: true
      interval: 300
      url: http://www.gstatic.com/generate_204

# ============================================================
# 规则提供者 — Loyalsoldier/clash-rules
# 社区维护的成熟分流规则，自动更新
# ============================================================
rule-providers:
  reject:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/reject.yaml
  direct:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/direct.yaml
  private:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/private.yaml
  proxy:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/proxy.yaml
  apple:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/apple.yaml
  icloud:
    type: http
    behavior: domain
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/icloud.yaml
  cncidr:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/cncidr.yaml

proxy-groups:
  - name: StableDirect
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    # 主力组只保留实测能连通的直连 Hysteria2 节点；避免切到大批 VLESS/订阅说明项导致抖动。
    filter: 香港直连[1-6]|日本直连[1-3]
    use:
      - Provider

  - name: LowLatency
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 80
    # 近端低延迟候选；保留日本直连作为香港节点拥塞时的低延迟备选。
    filter: 香港直连[1-6]|日本直连[1-3]
    use:
      - Provider

  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 120
    # 自动组只在近期可用且延迟相对可控的节点里选择。
    filter: 香港直连[1-6]|日本直连[1-3]|美国0[1-2]
    use:
      - Provider

  - name: Fallback
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 180
    # 故障切换组按稳定性优先，不纳入当前大量探测失败的 v2/v3/v4/v5 节点。
    filter: 香港直连[1-6]|日本直连[1-3]|美国0[1-2]
    use:
      - Provider

  - name: LoadBalance
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    filter: 香港直连[1-6]|日本直连[1-3]
    use:
      - Provider

  - name: Proxy
    type: select
    proxies:
      - StableDirect
      - LowLatency
      - Fallback
      - Auto
      - LoadBalance
      - DIRECT

rules:
  # --- 自定义规则（高优先级）---
  # 订阅和节点域名必须直连，否则坏节点会阻断订阅刷新和节点建连。
  - DOMAIN-SUFFIX,jfdddy.net,DIRECT
  - DOMAIN-SUFFIX,jf88.co,DIRECT
  - DOMAIN-SUFFIX,hy2use.net,DIRECT
  - DOMAIN-SUFFIX,fatdns.net,DIRECT

  # 国内 AI 服务直连
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,minimax.com,DIRECT
  - DOMAIN-SUFFIX,hailuoai.com,DIRECT
  - DOMAIN-SUFFIX,ustc.edu.cn,DIRECT
  - DOMAIN-SUFFIX,debian.org,DIRECT

  # --- 社区规则集 (Loyalsoldier) ---
  - RULE-SET,reject,REJECT
  - RULE-SET,private,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,Proxy
  - RULE-SET,cncidr,DIRECT

  # --- GEOSITE 规则（兜底）---
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,google-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,speedtest,DIRECT
  - GEOSITE,netflix,Proxy
  - GEOSITE,youtube,Proxy
  - GEOSITE,geolocation-!cn,Proxy

  - GEOIP,CN,DIRECT
  - MATCH,Proxy

sniffer:
  enable: true
  sniffing:
    - tls
    - http
    - quic                    # 🎯 新增：嗅探 QUIC 流量

tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-redirect: true
  dns-hijack:
    - any:53
