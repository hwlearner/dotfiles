# macOS Mihomo — 直连订阅，不走家里 Clash
# 基于 PVE 家服配置修改

mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: /Users/han/.config/mihomo/ui

dns:
  enable: true
  listen: 0.0.0.0:5353
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - https://doh.pub/dns-query
    - tls://223.5.5.5:853
  fallback:
    - tls://1.12.12.12:853
  fallback-filter:
    geoip: true
    geoip-code: CN
  fake-ip-range: 198.18.0.1/16
  enhanced-mode: fake-ip
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.localhost'
    - '+.msftncsi.com'
    - '+.srnd'
    - '+.tail3fd170.ts.net'
    # 代理节点服务器域名（绕过 fake-ip，否则节点连不上）
    - '+.fatdns.net'
    - '+.hy2use.net'
    - '+.jf88.co'
    - '+.jfdddy.net'
  proxy-server-nameserver:
    - 223.5.5.5
    - 114.114.114.114

proxy-providers:
  Provider:
    type: http
    url: https://jfdddy.net/link/VTBaHMehkBM7MHTo?clash=1
    interval: 3600
    path: /Users/han/.config/mihomo/provider.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# ============================================================
# 规则提供者 — Loyalsoldier/clash-rules
# 社区维护的成熟分流规则，自动更新
# ============================================================
rule-providers:
  reject:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/reject.yaml

  direct:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/direct.yaml

  private:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/private.yaml

  proxy:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/proxy.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/proxy.yaml

  apple:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/apple.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/apple.yaml

  icloud:
    type: http
    behavior: classical
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/icloud.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/icloud.yaml

  cncidr:
    type: http
    behavior: ipcidr
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/cncidr.txt
    interval: 86400
    path: /Users/han/.config/mihomo/rules/cncidr.yaml

proxy-groups:
  - name: 日本
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    filter: 日本|JP|Tokyo
    use:
      - Provider

  - name: Auto
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - Provider

  - name: Fallback
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - Provider

  - name: LoadBalance
    type: load-balance
    strategy: consistent-hashing
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - Provider

  - name: Proxy
    type: select
    proxies:
      - Fallback
      - Auto
      - LoadBalance
      - DIRECT
    use:
      - Provider

rules:
  # --- 自定义规则（高优先级）---
  # 国内 AI 服务直连
  - DOMAIN-SUFFIX,deepseek.com,DIRECT
  - DOMAIN-SUFFIX,minimax.com,DIRECT
  - DOMAIN-SUFFIX,hailuoai.com,DIRECT
  - DOMAIN-SUFFIX,ustc.edu.cn,DIRECT
  - DOMAIN-SUFFIX,debian.org,DIRECT

  # ChatGPT / OpenAI 强制走日本节点
  - DOMAIN-SUFFIX,chatgpt.com,日本
  - DOMAIN-SUFFIX,openai.com,日本
  - DOMAIN-SUFFIX,oaistatic.com,日本
  - DOMAIN-SUFFIX,oaiusercontent.com,日本

  # --- 社区规则集 (Loyalsoldier) ---
  - RULE-SET,reject,REJECT
  - RULE-SET,private,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,proxy,Proxy
  - RULE-SET,cncidr,DIRECT

  # --- Catppuccin GEOSITE 规则（兜底）---
  - GEOSITE,category-ads-all,REJECT
  - GEOSITE,private,DIRECT
  - GEOSITE,microsoft@cn,DIRECT
  - GEOSITE,apple-cn,DIRECT
  - GEOSITE,google-cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT
  - GEOSITE,speedtest,DIRECT
  - GEOSITE,netflix,Proxy
  - GEOSITE,youtube,Proxy
  - GEOSITE,geolocation-!cn,Proxy

  - GEOIP,CN,DIRECT
  - MATCH,Proxy

sniffer:
  enable: true
  sniffing:
    - tls
    - http
